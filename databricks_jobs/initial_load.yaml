resources:
  jobs:
    Yellow_Taxi_Initial_Load:
      name: "Yellow Taxi Initial Load "
      description: |-
        Performs an initial load of the data from [NYC TLC Yellow Taxi Trip Records]([https://www.nyc.gov/site/tlc/about/tlc-trip-record-data.page).   

        Given `end_date` and `months_prev` as parameters if downloads all raw data and passes through the bronze, silver, and gold layers. 
      tasks:
        - task_key: backfill_historical_yellow_trips
          notebook_task:
            notebook_path: one_off/backfill_historical_yellow_trips.py
            source: GIT
        - task_key: bronze_yellow_trips_raw
          depends_on:
            - task_key: backfill_historical_yellow_trips
          notebook_task:
            notebook_path: one_off/initial_load/notebooks/01_bronze/01_yellow_trips_raw.py
            source: GIT
        - task_key: load_taxi_zone_looup
          notebook_task:
            notebook_path: one_off/load_taxi_zone_lookup.py
            source: GIT
        - task_key: silver_taxi_zone_lookup
          depends_on:
            - task_key: load_taxi_zone_looup
          notebook_task:
            notebook_path: one_off/initial_load/notebooks/02_silver/01_taxi_zone_lookup.py
            source: GIT
        - task_key: silver_yellow_trips_cleansed
          depends_on:
            - task_key: silver_taxi_zone_lookup
            - task_key: bronze_yellow_trips_raw
          notebook_task:
            notebook_path: one_off/initial_load/notebooks/02_silver/02_yellow_trips_cleansed.py
            source: GIT
        - task_key: silver_yellow_trips_enriched
          depends_on:
            - task_key: silver_yellow_trips_cleansed
          notebook_task:
            notebook_path: one_off/initial_load/notebooks/02_silver/03_yellow_trips_enriched.py
            source: GIT
        - task_key: gold_daily_trips_summary
          depends_on:
            - task_key: silver_yellow_trips_enriched
          notebook_task:
            notebook_path: one_off/initial_load/notebooks/03_gold/daily_trips_summary.py
            source: GIT
      git_source:
        git_url: https://github.com/mmkke/nyctaxi_databricks_project.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      parameters:
        - name: end_month
          default: 2025-10
        - name: prev_months
          default: "12"
        - name: job_id
          default: "{{job.id}}"
        - name: job_name
          default: "{{job.name}}"
        - name: job_run_id
          default: "{{job.run_id}}"
      performance_target: PERFORMANCE_OPTIMIZED
